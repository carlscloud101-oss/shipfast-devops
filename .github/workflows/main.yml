name: ShipFast CI/CD 
 
on: 
  push: 
    branches: ["main"] 
 
jobs: 
  deploy: 
    runs-on: ubuntu-latest 
    steps: 
      - name: Deploy to EC2 via SSH 
        uses: appleboy/ssh-action@v1.0.0 
        with: 
          host: ${{ secrets.EC2_IP }} 
          username: ${{ secrets.EC2_USER }} 
          key: ${{ secrets.EC2_KEY }} 
          script: | 
            cd ~/shipfast-app 
            git pull origin main 
            cp -r ~/shipfast-app/* /var/www/shipfast/ 
            cd /var/www/shipfast 
            npm install 
            pm2 restart shipfast --update-env || pm2 start app.js --name shipfast 
